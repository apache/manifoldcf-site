name: Build & Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro project
        run: npm run check

      - name: Build static site for GitHub Pages
        run: npm run build:gh-pages

      - name: Publish to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add /tmp/gh-pages origin/gh-pages
            cd /tmp/gh-pages
            git checkout -B gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
            cd /tmp/gh-pages
          fi

          cp -a "$GITHUB_WORKSPACE/dist/." .
          touch .nojekyll
          rm -f .htaccess

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy GitHub Pages preview from ${{ github.sha }}"
            git push origin gh-pages
          else
            echo "No changes to publish to gh-pages."
          fi

      - name: Build static site for ASF Staging (manifoldcf.staged.apache.org)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run build:asf-staging

      - name: Publish to asf-staging branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/asf-staging
          mkdir -p /tmp/asf-staging

          if git ls-remote --exit-code --heads origin asf-staging >/dev/null 2>&1; then
            git fetch --depth=1 origin asf-staging
            git worktree add /tmp/asf-staging origin/asf-staging
            cd /tmp/asf-staging
            git checkout -B asf-staging
          else
            git worktree add --orphan -b asf-staging /tmp/asf-staging
            cd /tmp/asf-staging
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cat > .asf.yaml <<'EOF'
          staging:
            profile: ~
            whoami: asf-staging
          EOF

          mkdir -p content
          rsync -av --delete "$GITHUB_WORKSPACE/dist/" content/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Stage website to asf-staging from ${{ github.sha }}"
            git push origin asf-staging
          else
            echo "No changes to publish to asf-staging."
          fi
